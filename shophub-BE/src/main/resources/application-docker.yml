server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:shophub}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:mailhog}
    port: ${MAIL_PORT:1025}

shophub:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
