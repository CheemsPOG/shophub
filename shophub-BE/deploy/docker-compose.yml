name: shophub-v2

services:
  postgres:
    image: postgres:16-alpine
    container_name: shophub-v2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shophub
      POSTGRES_USER: shophub
      POSTGRES_PASSWORD: shophub_secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shophub -d shophub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: shophub-v2-redis
    restart: unless-stopped
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: shophub-v2-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: shophub
      MINIO_ROOT_PASSWORD: shophub_secret
    ports:
      - "9004:9000"
      - "9005:9001"
    volumes:
      - minio_data:/data

  mailhog:
    image: mailhog/mailhog:latest
    container_name: shophub-v2-mailhog
    restart: unless-stopped
    ports:
      - "1027:1025"
      - "8027:8025"

  backend:
    build:
      context: ..
    container_name: shophub-v2-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: shophub
      DB_USERNAME: shophub
      DB_PASSWORD: shophub_secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MINIO_ENDPOINT: http://minio:9000
      JWT_SECRET: shophub-v2-dev-secret-change-me-please-32b
      DEMO_DATA: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: ../../shophub-FE
    container_name: shophub-v2-frontend
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: shophub-v2-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/shophub.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "8091:80"

volumes:
  postgres_data:
  minio_data:
