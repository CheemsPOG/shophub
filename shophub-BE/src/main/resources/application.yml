spring:
  application:
    name: shophub-be
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:shophub}
    username: ${DB_USERNAME:shophub}
    password: ${DB_PASSWORD:shophub_secret}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6382}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1027}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: false
    mail:
      enabled: false

info:
  app:
    name: shophub-be
    phase: 11
    description: ShopHub v2 marketplace backend

shophub:
  jwt:
    secret: ${JWT_SECRET:shophub-v2-dev-secret-change-me-please-32b}
    access-token-ttl-minutes: 30
    refresh-token-ttl-days: 7
    remember-me-ttl-days: 30
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9004}
    access-key: ${MINIO_ACCESS_KEY:shophub}
    secret-key: ${MINIO_SECRET_KEY:shophub_secret}
    bucket: ${MINIO_BUCKET:shophub-assets}
  demo:
    enabled: ${DEMO_DATA:true}
